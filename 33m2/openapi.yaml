openapi: "3.1.0"
info:
  title: "33m2 REST API (역설계 사이드카)"
  version: "0.1.0-reverse-engineered"
  description: "33m2 Retrofit 인터페이스에서 역추출한 180 메서드 계약. 성공 응답은 {code:'SCSS_001', data:<schema>} 엔벨로프로 감싸짐 (여기 schema는 data 부분). 에러는 HTTP 400 + {code, message:{type,content}}. 박스형 타입(Integer/Long/Boolean/Double)은 nullable=true로 표기(추론). 출처: _shared/captures/33m2.api-full.json + dto.json + req-dto.json. 정본은 33m2/api-contract.md."
servers:
  - url: "https://web.33m2.co.kr"
    description: 관찰된 호스트 (실제 API 게이트웨이는 별도 추정)
tags:
